# Checks every push and pull request. A push to main that passes everything is deployed to
# GitHub Pages: https://sebastienlachance.github.io/guitar-trainer/
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # A newer push replaces an older run on a branch, but runs on main finish so each one deploys.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NG_CLI_ANALYTICS: 'false'

jobs:
  check:
    name: Format, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:once
      - name: Build for GitHub Pages
        # The app lives under /guitar-trainer/. BUILD_COMMIT and BUILD_DATE show on the home page.
        run: >
          npx ng build
          --base-href /guitar-trainer/
          --define "BUILD_COMMIT='${{ github.sha }}'"
          --define "BUILD_DATE='$(git log -1 --format=%cI)'"
      - name: Upload the site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/guitar-trainer/browser

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: [check, e2e]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
