<h1 class="visually-hidden">Play it back stats</h1>

<app-stats-overview />
<app-session-history />

@if (hasAnswers()) {
  @if (grid(); as grid) {
    <section class="panel">
      <h2>Intervals by ear</h2>
      <app-accuracy-grid [columns]="intervals" [rows]="grid" rowHeader="Direction" />
    </section>
  }

  <section class="panel">
    <h2>Practise these more</h2>
    <app-weakest-cards [describe]="describeCard" />
  </section>

  <app-reset-stats />
} @else {
  <section class="panel">
    <h2>No answers yet</h2>
    <p class="muted">
      Your accuracy for each interval and melody shows up here once you've practised.
    </p>
    <a routerLink="../practice" class="btn btn-primary">Go to practice</a>
  </section>
}
