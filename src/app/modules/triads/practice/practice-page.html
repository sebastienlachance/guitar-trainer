<app-practice-frame [prompt]="prompt" [answer]="answer" />

<ng-template #prompt>
  <div class="question" [class.listening]="settings().micMode !== 'off'" aria-live="polite">
    @if (settings().micMode !== 'off') {
      <p class="heard">
        @if (heardLast()) {
          <app-icon name="check" /><span class="visually-hidden">Heard </span>{{ heardLast() }}
        }
      </p>
    }
    <p class="play muted">Play</p>
    <h1 class="chord">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="shape muted">{{ subtitle() }}</p>
    }
  </div>
  @if (settings().micMode !== 'off') {
    <app-mic-status
      [hint]="
        settings().micMode === 'arpeggio' ? 'play the notes one at a time' : 'strum the chord'
      "
      [showHeard]="settings().micMode === 'arpeggio'"
      [spectrumFor]="strumTarget()"
    />
  }
</ng-template>

<ng-template #answer>
  @if (card(); as card) {
    <p class="answer-head muted">
      {{ title() }}
      @if (subtitle()) {
        · {{ subtitle() }}
      }
    </p>
    <app-chord-reveal
      [card]="card"
      [shapes]="session.revealShapes()"
      [labelMode]="settings().labelMode"
      (labelModeChange)="setLabelMode($event)"
    />
  }
</ng-template>
