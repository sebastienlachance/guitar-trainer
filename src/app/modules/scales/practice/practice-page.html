<app-practice-frame [prompt]="prompt" />

<ng-template #prompt>
  @if (card()) {
    <div class="question" aria-live="polite">
      <p class="ask muted">Which scale is this? The root is in amber.</p>
      <h1>{{ heading() }}</h1>
      @if (answered()) {
        <p class="formula">{{ formula() }}</p>
      }
    </div>

    <div class="board">
      <app-fretboard [dots]="dots()" [window]="window()" [description]="description()" />
    </div>

    <app-choice-buttons
      label="Scale names"
      [options]="options()"
      [checked]="checked()"
      [takesFocus]="true"
      (chosen)="session.answer($event)"
    />
  }
</ng-template>
